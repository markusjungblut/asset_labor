name: Rebuild stone masonry from painted material and exact palisade geometry
on:
  push:
    branches: [feat/stone-battlements-aoe2-20261123]
    paths:
      - 'scripts/build_stone_walls_from_palisade_v6.py'
      - '.github/workflows/stone-repaint-oneshot.yml'
permissions:
  contents: write
jobs:
  paint:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stone-battlements-aoe2-20261123
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 numpy==2.3.3
      - run: python scripts/build_stone_walls_from_palisade_v6.py
      - name: Commit painted masonry and actual-coordinate visual proofs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/walls/stone/v6/
          if ! git diff --cached --quiet; then
            git commit -m "art(stone): replace flat facades with originally painted mineral texture and directional lighting"
            git push origin HEAD:feat/stone-battlements-aoe2-20261123
          fi
