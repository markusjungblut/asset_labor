name: Stone Walls – Original Painted Stone v7 Regression
on:
  push:
    branches: [feat/stone-battlements-aoe2-20261123]
    paths:
      - 'assets/walls/stone/v7/**'
      - 'assets/walls/stone/gates/**'
      - 'wall-ui.js'
      - 'walls.js'
      - 'app.js'
      - 'nature-ui.js'
      - 'index.html'
      - 'scripts/build_stone_walls_from_painted_atlas_v7.py'
      - 'tests/real_editor_stone_v7.cjs'
      - 'tests/test_wall_edges_v1_20261122.cjs'
      - 'tests/test_stone_webp_v2_20261123.cjs'
      - 'tests/automated_browser_wall_art_v3_20261123.cjs'
      - '.github/workflows/stone-wall-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/walls/stone/**'
      - 'assets/walls/palisade/**'
      - 'walls.js'
      - 'wall-ui.js'
      - 'nature-ui.js'
      - 'tests/test_wall_edges_v1_20261122.cjs'
      - 'tests/test_stone_webp_v2_20261123.cjs'
      - 'tests/automated_browser_wall_art_v3_20261123.cjs'
      - '.github/workflows/stone-wall-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stone-raster:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical edges, palisade compatibility and painted stone PNGs
        run: node --test tests/test_wall_edges_v1_20261122.cjs tests/test_stone_webp_v2_20261123.cjs
      - name: Install headless Firefox for visual decoding
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps firefox
      - name: Browser rendering, corners and unified shadow acceptance
        run: node tests/automated_browser_wall_art_v3_20261123.cjs
      - name: Real asset-labor editor six-edge rendering and screenshot
        if: always()
        run: node tests/real_editor_stone_v7.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stone-wall-original-v7-editor-preview
          path: |
            test-artifacts/wall-art-v3-all-directions.png
            test-artifacts/editor-stone-v7.png
            test-artifacts/editor-stone-v7-closeup.png
            test-artifacts/editor-stone-open-south-v.png
            test-artifacts/editor-stone-gates-all.png
            test-artifacts/editor-stone-gates-open.png
            test-artifacts/editor-palisade-grid-closeup.png
          if-no-files-found: ignore
