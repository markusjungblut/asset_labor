name: Geography Large-Map Bake – Focused Node Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'large-map-bake-*.js'
      - 'tests/test_large_map_bake_*.cjs'
      - '.github/workflows/geography-large-bake-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Minimal source checkout without image atlases
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /worldgen-geography.js
            /geography-lab-presets.js
            /geography-lab.html
            /geography-lab.js
            /.github/workflows/geography-large-bake-ci.yml
            /chunks.js
            /large-map-bake-plan.js
            /large-map-bake-source.js
            /large-map-bake-authoring.js
            /large-map-bake-ground-relief.js
            /large-map-bake-shoreline.js
            /large-map-bake-rivers.js
            /large-map-bake-forest-floor.js
            /large-map-bake-scenery-source.js
            /large-map-bake-mountain-png.js
            /large-map-bake-nature-source.js
            /large-map-bake-nature-trunks.js
            /large-map-bake-tree-png.js
            /large-map-bake-canopy-audit.js
            /sprite-planner.js
            /roads.js
            /nature-balance.js
            /existing-asset-rules.js
            /polish.js
            /mountain.js
            /nature_catalog.js
            /assets/nature/nature_catalog.json
            /assets/terrain/terrain_catalog.json
            /forest.js
            /forest-ground.js
            /river-banks.js
            /river.js
            /shoreline.js
            /relief.js
            /large-map-bake-material-preview.js
            /large-map-bake-runner.js
            /large-map-bake-storage.js
            /large-map-bake-export.js
            /frozen-map-package.js
            /autotile.js
            /water-texture.js
            /catalog.js
            /app.js
            /index.html
            /tests/test_large_map_bake_plan_20261122.cjs
            /tests/test_large_map_bake_source_20261122.cjs
            /tests/test_large_map_bake_authoring_20261122.cjs
            /tests/test_large_map_bake_runner_20261122.cjs
            /tests/test_large_map_bake_storage_20261122.cjs
            /tests/test_large_map_bake_export_20261122.cjs
            /tests/test_large_map_reference_probe_20261122.cjs
            /tests/test_large_map_material_preview_20261122.cjs
            /tests/test_large_map_ground_relief_20261122.cjs
            /tests/test_large_map_bake_shoreline_20261122.cjs
            /tests/test_large_map_bake_rivers_20261122.cjs
            /tests/test_large_map_river_raster_window_20261122.cjs
            /tests/test_large_map_bake_forest_floor_20261122.cjs
            /tests/test_large_map_scenery_source_20261122.cjs
            /tests/test_large_map_bake_nature_source_20261122.cjs
            /tests/test_large_map_bake_nature_trunks_20261122.cjs
            /tests/test_large_map_bake_tree_png_20261122.cjs
            /tests/test_large_map_bake_canopy_audit_20261123.cjs
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Planner, real renderer neighbor parity and PNG receipts
        run: |
          node --test tests/test_large_map_bake_*.cjs tests/test_large_map_reference_probe_20261122.cjs tests/test_large_map_material_preview_20261122.cjs tests/test_large_map_ground_relief_20261122.cjs tests/test_large_map_bake_shoreline_20261122.cjs tests/test_large_map_bake_rivers_20261122.cjs tests/test_large_map_river_raster_window_20261122.cjs tests/test_large_map_bake_forest_floor_20261122.cjs tests/test_large_map_scenery_source_20261122.cjs
