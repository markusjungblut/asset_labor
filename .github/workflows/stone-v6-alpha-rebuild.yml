name: Rebuild palisade-native stone v6 after edge-alpha cleanup
on:
  push:
    branches: [feat/stone-battlements-aoe2-20261123]
    paths:
      - 'scripts/build_stone_walls_from_palisade_v6.py'
      - '.github/workflows/stone-v6-alpha-rebuild.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'markusjungblut/asset_labor'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stone-battlements-aoe2-20261123
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 numpy==2.3.3
      - name: Regenerate six clean alpha wall sprites and two corner posts
        run: python scripts/build_stone_walls_from_palisade_v6.py
      - name: Update only existing PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/walls/stone/v6/
          if ! git diff --cached --quiet; then
            git commit -m "art(stone): regenerate clean alpha v6 masonry after browser pixel audit"
            git push origin HEAD:feat/stone-battlements-aoe2-20261123
          fi
