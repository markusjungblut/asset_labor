name: Geography Lab – JSON Import/Export Browser Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'geography-io.js'
      - 'geography-lab.js'
      - 'geography-lab.html'
      - 'app.js'
      - 'index.html'
      - 'tests/test_geography_io_validation_20261120.cjs'
      - 'tests/automated_browser_geography_io_roundtrip_20261120.cjs'
      - 'tests/automated_browser_geography_tree_png_20261123.cjs'
      - 'large-map-bake-tree-png.js'
      - 'large-map-bake-joint-scenery.js'
      - 'large-map-bake-warm-boulders.js'
      - 'large-map-bake-nature-late-rock-snow.js'
      - 'large-map-bake-nature-accents.js'
      - 'large-map-bake-original-sprite-shadows.js'
      - 'large-map-bake-original-mountain-shadows.js'
      - 'large-map-bake-mountain-receivers.js'
      - 'large-map-bake-editor-reference-sprite.js'
      - 'tests/automated_browser_geography_editor_parity_20261123.cjs'
      - 'large-map-bake-authored-mountain-shadows.js'
      - 'large-map-bake-scenery-seam.js'
      - 'tests/automated_browser_geography_joint_scenery_20261123.cjs'
      - '.github/workflows/geography-io-regression.yml'
  workflow_dispatch:

# Cancel outdated PR test runs when a newer diagnostic commit arrives.
concurrency:
  group: geography-io-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  geography-io:
    name: Actual JSON downloads, imports and popup handoff in Firefox
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.js
            /*.html
            /tests/test_geography_io_validation_20261120.cjs
            /tests/automated_browser_geography_io_roundtrip_20261120.cjs
            /tests/automated_browser_geography_tree_png_20261123.cjs
            /tests/automated_browser_geography_joint_scenery_20261123.cjs
            /tests/automated_browser_geography_editor_parity_20261123.cjs
            /assets/nature/nature_catalog.json
            /assets/nature/birke1.png
            /assets/nature/berg_01.png
            /assets/nature/boulder_36.png
            /assets/nature/boulder_01.png
            /assets/nature/snow_patch_01.png
            /assets/nature/bush_01.png
            /assets/nature/fallen_log_01.png
            /assets/nature/dead_tree_01.png
            /assets/shadows/sprite_shadow_profiles.json
            /shadow-system.js
            /large-map-bake-original-mountain-shadows.js
            /assets/terrain/terrain_catalog.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate parameter/world/statistic schemas and Asset-Labor handoff
        run: node --test tests/test_geography_io_validation_20261120.cjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: vedras-geography-firefox-1.57.0
      - name: Install Firefox for real click/download and upload tests
        run: |
          mkdir -p .ci-tools
          npm --prefix .ci-tools install --no-fund --no-audit --no-save playwright@1.57.0
          .ci-tools/node_modules/.bin/playwright install --with-deps firefox
      - name: Firefox – parameters/world/statistics download/import roundtrip and popup feedback
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
          VEDRAS_CI_ARTIFACTS: test-artifacts
        run: node tests/automated_browser_geography_io_roundtrip_20261120.cjs
      - name: Firefox – actual original birch PNG and adjacent WorldTile pixel seam
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
        run: node tests/automated_browser_geography_tree_png_20261123.cjs
      - name: Firefox – native editor drawSprite, mountain-foot occlusion and 2.5D image projection parity
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
        run: node tests/automated_browser_geography_editor_parity_20261123.cjs
      - name: Firefox – real original tree+mountain joint Scenery and adjacent pixel seam
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
        run: node tests/automated_browser_geography_joint_scenery_20261123.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geography-io-regression
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
