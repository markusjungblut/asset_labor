name: Build original-based painted palisade gates
on:
  push:
    branches: [feat/stone-battlements-aoe2-20261123]
    paths: ['scripts/compose_palisade_ai_v4.py']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/compose_palisade_ai_v4.py
            assets/walls/palisade
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - run: python scripts/compose_palisade_ai_v4.py
      - uses: actions/upload-artifact@v4
        with:
          name: palisade-ai-original-v4
          path: palisade-gate-v4-output/
          if-no-files-found: error
