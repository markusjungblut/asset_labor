name: Build stone v5 geometry prototypes (one-shot branch)
on:
  push:
    branches: ['feat/stone-battlements-aoe2-20261123']
    paths:
      - 'scripts/author_stone_walls_v5.py'
      - '.github/workflows/stone-v5-prototype.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'markusjungblut/asset_labor'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stone-battlements-aoe2-20261123
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Reconstruct from actual river hex projection and produce preview
        run: python scripts/author_stone_walls_v5.py
      - name: Commit only six prototype PNGs, two joints and coordinate proof to existing PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/walls/stone/v5/
          if ! git diff --cached --quiet; then
            git commit -m "art(stone): add geometrically reanchored six-direction v5 candidates and map proof"
            git push origin HEAD:feat/stone-battlements-aoe2-20261123
          fi
