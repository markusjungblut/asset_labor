name: Build native timber gate PNG assets
on:
  push:
    branches: [feat/stone-battlements-aoe2-20261123]
    paths:
      - 'scripts/build_palisade_gate_raster_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raster:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - run: python scripts/build_palisade_gate_raster_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: palisade-gate-native-raster
          path: |
            assets/walls/palisade/gates/v1/gate_dir*.png
            timber-gate-preview.png
          if-no-files-found: error
