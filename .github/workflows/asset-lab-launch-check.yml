name: Asset-Labor – Windows entrypoint and localhost startup

on:
  pull_request:
    branches: [main]
    paths:
      - START_WINDOWS.bat
      - server.py
      - index.html
      - README.md
      - static_terrain_store.py
      - tests/test_asset_lab_startup.py
      - .github/workflows/asset-lab-launch-check.yml

permissions:
  contents: read

jobs:
  launch-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Sparse checkout – server and editor entry only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /START_WINDOWS.bat
            /server.py
            /index.html
            /static_terrain_store.py
            /tests/test_asset_lab_startup.py
      - name: Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate localhost asset-lab entrypoint and strict port
        run: python -B tests/test_asset_lab_startup.py
