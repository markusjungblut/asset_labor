<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vedras Reiche – Fertige Spielkarte testen</title>
<style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#101d24;color:#ebf4ef}
body{display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:#14272c;border-bottom:1px solid #48615b}
h1{font-size:1rem;margin:0}small{color:#a4bfb5}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;max-width:100%;overflow-x:auto}
button[hidden]{display:none}
/* Reserve room for variable status labels without moving the toolbar. */
#zoom{display:inline-block;min-width:5ch;text-align:center;font-variant-numeric:tabular-nums}
#rasterQuality{display:inline-block;min-width:10ch;text-align:center;white-space:nowrap}
button,a{font:inherit;color:#e9f6ec;background:#254f43;border:1px solid #577e6c;border-radius:6px;padding:7px 10px;text-decoration:none;cursor:pointer}
button:hover,a:hover{background:#367058}
button:disabled{opacity:.5;cursor:not-allowed}
main{position:relative;flex:1;min-height:0;overflow:hidden;background:#bccbd1}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
/* Opt-in overlay: world stays beneath the independently refreshed Fog. */
#fogOverlay{position:absolute;inset:0;pointer-events:none;cursor:default}
#fogOverlay[hidden]{display:none}
/* Status is an OVERLAY-FREE, fixed-height strip: changing statistics must
   never resize the map canvas or force a new scene raster. */
footer{box-sizing:border-box;flex:0 0 36px;height:36px;min-height:36px;
 max-height:36px;padding:7px 13px;background:#14272c;display:flex;
 gap:15px;align-items:center;flex-wrap:nowrap;overflow:hidden;
 white-space:nowrap;font-size:.75rem;color:#b5cfc5}
#message,#metrics{display:block;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap;min-width:0;line-height:20px}
#message{flex:0 1 33%}
#metrics{flex:1 1 67%;text-align:right;font-variant-numeric:tabular-nums}
</style></head>
<body>
<header><div><h1>Vedras Reiche · Fertige Spielkarte</h1>
<small>Eigenständiger Lesemodus – keine Editor-, Terrain-Worker- oder Bake-Skripte</small></div>
<div class="controls"><button id="zoomOut">−</button><span id="zoom">100 %</span>
<button id="zoomIn">+</button><span id="rasterQuality" title="Physikalische Canvas-Renderauflösung">Raster ?×</span><button id="resetView">Ansicht zurücksetzen</button>
<a id="atlasBenchmark" href="frozen-map-benchmark.html">Bildatlas vergleichen</a>
<button id="downloadProfile" hidden title="Profilbericht im JSON-Format herunterladen">Performance-JSON</button>
<a href="index.html">Asset-Labor öffnen</a></div></header>
<main><canvas id="game" aria-label="Fertig vorberechnete Spielkarte"></canvas><canvas id="fogOverlay" aria-hidden="true" hidden></canvas></main>
<footer><span id="message">Gespeicherte Spielkarte wird geladen …</span>
<span id="metrics">Keine Renderaufträge</span></footer>
<script src="cloud-artwork.js?v=20261102-step22-true-alpha"></script>
<script src="frozen-map-view-policy.js?v=20261102-step21"></script>
<script src="frozen-map-fog-viewport.js?v=20261103-step25h"></script>
<script src="frozen-map-profiler.js?v=20261103-step25d-churn"></script>
<script src="frozen-map-runtime.js?v=20261108-step25m-world-pad"></script>
<script src="frozen-map-derived-2x.js?v=20261102-step20-2x"></script>
<script src="frozen-map-derived-1x.js?v=20261102-step25b"></script>
<script src="frozen-map-game.js?v=20261108-step25m-world-pad"></script>
</body></html>
